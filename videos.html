<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Videos | Guppy Diary</title>
	<link rel="stylesheet" type="text/css" href="css/style.css"> 
	<script src="https://use.fontawesome.com/d1341f9b7a.js"></script>
</head>
<body>

<div class="background">
	<div class="layout">
		<nav class="nav" aria-label="Primary">
			<a class="a" href="index.html">HOME</a>
			<a class="b" href="aboutme.html">ABOUT ME</a>
			<a class="c" href="images.html">IMAGES</a>
			<a class="d active" href="videos.html" aria-current="page">VIDEOS</a>
		</nav>

		<main class="content" id="main">
			<section class="videos" aria-labelledby="videos-title">
				<h1 id="videos-title">Play 'Em</h1>

				<div class="video-grid">
					<figure class="video-card">
						<video class="video" controls preload="metadata">
							<source src="video.mp4" type="video/mp4">
						</video>
						<figcaption>Local video</figcaption>
					</figure>

					<figure class="video-card">
						<div class="embed">
							<iframe
								src="https://www.youtube.com/embed/IJX3b6Yik48"
								title="YouTube video player"
								frameborder="0"
								allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
								allowfullscreen
							></iframe>
						</div>
						<figcaption>YouTube video</figcaption>
					</figure>
				</div>
			</section>
		</main>
	</div>



</body>
</html>
